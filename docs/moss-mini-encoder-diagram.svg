<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="524" viewBox="0 0 680 524" role="img">
<title>MOSS-Image Mini Encoder 训练与推理数据流原理图</title>
<desc>上半部分为离线训练：9B 教师产生 4096 维目标特征，与学生模型的 6 层抽头特征逐 token 配对，用 Ridge 闭式解求投影矩阵并导出 adapter.safetensors。下半部分为 ComfyUI 推理：MossCLIPLoader 加载学生模型取 6 层抽头，经标准化与线性投影得到 4096 维条件向量，交回官方 CLIPTextEncode 与 DiT。核心契约是 DiT 只接收固定形状的条件张量，不检查来源模型。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="30" width="600" height="170" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="52" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#0C447C">离线训练 · 只做一次（第 4 节）</text>
<rect x="60" y="66" width="170" height="64" rx="10" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="145" y="90" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#042C53">9B 教师 w4a8</text>
<text x="145" y="112" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#185FA5">teacher.raw [N,4096]</text>
<path d="M230 98 H250" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="255" y="66" width="170" height="64" rx="10" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="90" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#042C53">逐 token 配对</text>
<text x="340" y="112" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#185FA5">同词表 · 同切分 · 同位置</text>
<path d="M425 98 H445" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450" y="66" width="170" height="64" rx="10" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="535" y="90" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#042C53">Ridge 闭式解</text>
<text x="535" y="112" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#185FA5">(ZᵀZ+λI)W=ZᵀY′</text>
<text x="60" y="158" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#185FA5">学生侧：6 层抽头拼接 → student.raw [N,d_in]；语料分 9 桶，超 4096 token 整条剔除</text>
<text x="60" y="180" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#185FA5">token 0 是 attention sink：拟合时剔除，另存教师均值向量</text>
<path d="M340 200 V216" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="210" y="220" width="260" height="44" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="236" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">adapter.safetensors</text>
<text x="340" y="254" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#5F5E5A">weight / mean / std / sink</text>
<path d="M340 264 V286" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="290" width="600" height="170" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="60" y="312" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#085041">ComfyUI 推理 · 每次出图（第 5 节）</text>
<rect x="60" y="326" width="170" height="64" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="145" y="350" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#04342C">MossCLIPLoader</text>
<text x="145" y="372" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#0F6E56">学生 6 抽头 [B,6,T,H]</text>
<path d="M230 358 H250" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="255" y="326" width="170" height="64" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="350" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#04342C">标准化 + 线性投影</text>
<text x="340" y="372" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#0F6E56">z@W*std_out+mean_out</text>
<path d="M425 358 H445" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450" y="326" width="170" height="64" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="535" y="350" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#04342C">cond [B,T,4096]</text>
<text x="535" y="372" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#0F6E56">官方 CLIPTextEncode → DiT</text>
<text x="60" y="418" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#0F6E56">shape：tokens → [B,6,T,H] → [B,T,d_in] → [B,T,4096]；token 0 替换为 sink</text>
<text x="60" y="440" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12" fill="#0F6E56">学生模型全程冻结，只覆写编码入口；finally 恢复 layer_idx，下游零改动</text>
<rect x="40" y="474" width="600" height="34" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="491" text-anchor="middle" dominant-baseline="central" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">接口契约：DiT 只接收 [B,T,4096] 条件向量，不检查它由谁产生</text>
</svg>
