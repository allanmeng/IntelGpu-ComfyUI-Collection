name: Generate index.html

on:
  # 定时触发由 cron-job.org 外部 dispatch 承担（GitHub schedule 漏跑严重已废弃，2026-08-29）
  push:
    branches: [main]
    paths: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate index.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_pages.py --index --token "$GH_TOKEN"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to index.html"
            exit 0
          fi
          git commit -m "chore: regenerate index.html"
          git push
