name: Generate guide index.html

on:
  push:
    branches: [main]
    paths: ['intel-comfyui-guide/*.md']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install markdown
        run: pip install markdown

      - name: Generate index.html (latest dated md)
        run: python intel-comfyui-guide/build_site.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel-comfyui-guide/index.html
          if git diff --cached --quiet; then
            echo "No changes to intel-comfyui-guide/index.html"
            exit 0
          fi
          git commit -m "chore: regenerate intel-comfyui-guide/index.html"
          git push
