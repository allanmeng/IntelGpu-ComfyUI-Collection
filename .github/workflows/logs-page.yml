name: Generate logs pages

on:
  push:
    branches: [main]
    paths:
      - 'log-analysis/**'
      - 'scripts/generate_pages.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate logs pages
        run: python scripts/generate_pages.py --logs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs.html logs/
          if git diff --cached --quiet; then
            echo "No changes to logs pages"
            exit 0
          fi
          git commit -m "chore: regenerate logs pages"
          git push
