name: Generate logs pages

on:
  push:
    branches: [main]
    paths:
      - 'log-analysis/**'
      - 'scripts/generate_pages.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须全量历史：脚本用 git log --follow 取文件首次入库时间作为时刻兜底，
          # 默认 fetch-depth: 1 只有一条提交，查不到 → 时刻会全部退化为空。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate logs pages
        run: python scripts/generate_pages.py --logs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs.html logs/
          if git diff --cached --quiet; then
            echo "No changes to logs pages"
            exit 0
          fi
          git commit -m "chore: regenerate logs pages"
          git push
